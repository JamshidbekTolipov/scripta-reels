name: Render Video

on:
  workflow_dispatch:
    inputs:
      composition:
        description: 'Kompozitsiya nomi'
        required: true
        default: 'ReelsVideo'

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Kodni olish
        uses: actions/checkout@v4

      - name: Node.js sozlash
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Kutubxonalarni o'rnatish
        run: npm ci

      - name: MP4 ga render qilish
        run: npx remotion render ${{ github.event.inputs.composition }} out/video.mp4

      - name: Tayyor videoni yuklash
        uses: actions/upload-artifact@v4
        with:
          name: scripta-video
          path: out/video.mp4